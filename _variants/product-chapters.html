<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карточка товара — тест v5 · HOMEART</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;1,300&display=swap">
<link rel="stylesheet" href="../assets/fonts.css?v=1792770868">
<link rel="stylesheet" href="../assets/site.css?v=1792770868">
<style>
/* Служебная страница: тестовая карточка товара v5 — главы по экрану (подача) + закреплённое описание (как у Casa Ricca).
   Фото, видео и тексты фабрик — с официальных сайтов, только для теста. На боевой сайт не выкладывается. */
:root{--paper:#fff;--out:cubic-bezier(.23,1,.32,1);--r2:3px;--stick:28px}
.ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.t{display:inline-block;vertical-align:middle;margin-left:8px;font:600 9px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:3px 6px}

.vbar{background:var(--ink);color:#f3eee6;font-size:13px}
.vbar__in{max-width:var(--maxw);margin:0 auto;padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.vbar__t{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.vbar__tabs{display:flex;gap:4px;flex-wrap:wrap}
.vbar__tabs a{padding:6px 13px;border-radius:999px;border:.5px solid rgba(243,238,230,.32)}
.vbar__tabs a:hover{border-color:#f3eee6}
.vbar__tabs a.on{background:#f3eee6;color:var(--ink)}
.vbar__note{flex-basis:100%;color:#bdb6aa;font-size:12.5px;line-height:1.5}
.vbar__note a{border-bottom:1px solid rgba(243,238,230,.4)}

.split{display:grid;grid-template-columns:clamp(150px,12.5vw,220px) minmax(0,1.25fr) minmax(0,.8fr);gap:clamp(22px,3vw,60px);margin-top:26px;align-items:start}

/* видео — слева, стоит */
.vid{position:sticky;top:var(--stick);cursor:pointer;outline-offset:4px}
.vid__h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite);margin-bottom:12px}
.vid__h i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.vid__f{position:relative;aspect-ratio:9/16;border-radius:var(--r2);overflow:hidden;background:#1d1b18}
.vid__f video,.vid__f img{width:100%;height:100%;object-fit:cover}
.vid__f img{animation:kb 16s ease-in-out infinite alternate;filter:saturate(.85)}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.22) translate(-6%,-4%)}}
.vid__play{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;display:grid;place-items:center;background:rgba(250,250,248,.9);color:var(--ink);opacity:0;transition:opacity .3s}
.vid:hover .vid__play,.vid:focus-visible .vid__play{opacity:1}
.vid__soon{position:absolute;left:12px;right:12px;bottom:12px;font-size:12.5px;line-height:1.4;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.vid__c{font-size:12.5px;color:var(--graphite-2);margin-top:10px;line-height:1.45}

/* ── главы: движется только эта колонка ── */
.rib{position:relative}
.rib__nav{position:sticky;top:var(--stick);height:0;z-index:4}
.rib__nav ol{position:absolute;left:calc(-1 * clamp(11px,1.5vw,30px));transform:translateX(-50%);list-style:none;display:flex;flex-direction:column;gap:2px;padding-top:6px}
.rib__nav button{display:grid;place-items:center;width:22px;height:16px;color:var(--sand);transition:color .25s}
.rib__nav button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rib__nav button i{width:10px;height:1.5px;background:currentColor;transition:width .35s var(--out)}
.rib__nav button:hover{color:var(--graphite)}
.rib__nav button.on{color:var(--ink)}
.rib__nav button.on i{width:20px}
.sc{position:relative;min-height:calc(100vh - 2 * var(--stick));display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,4vw,56px) 0}
.sc:first-child{min-height:0;padding-top:0}
.big{font-family:var(--sans);font-weight:300;font-size:clamp(22px,1.9vw,32px);line-height:1.2;letter-spacing:0;text-transform:uppercase;text-wrap:balance}
.lede{font-size:15.5px;line-height:1.65;color:var(--graphite);max-width:40ch}
.pic{margin:0;position:relative;overflow:hidden;border-radius:var(--r2);background:var(--paper);cursor:zoom-in}
.pic img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
.pic--cut img{object-fit:contain;mix-blend-mode:multiply;padding:8%}
.chipx{position:absolute;right:12px;bottom:12px;font-size:11px;padding:5px 10px;border-radius:999px;background:rgba(250,250,248,.9);color:var(--graphite)}
/* появление: слово выезжает снизу, один раз */
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s var(--out),transform 1.2s var(--out)}
.in .rv{opacity:1;transform:none}
.in .rv:nth-child(2){transition-delay:.08s}.in .rv:nth-child(3){transition-delay:.16s}

/* 1 — герой: крупное слово наезжает на фото */
/* 1 — первый кадр: только фото, предмет крупно и целиком, сразу сверху */
.sc.sc--hero{min-height:0;padding-top:0;justify-content:flex-start}
.sc--hero .pic{aspect-ratio:4/5;max-height:calc(100vh - 140px)}
.sc--hero .pic img{transition:none}
/* 2 — макро на весь блок, слово поверх */
.sc--macro .pic{position:absolute;inset:clamp(28px,4vw,56px) 0;border-radius:var(--r2)}
.sc--macro .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,15,0) 40%,rgba(20,18,15,.62) 100%);pointer-events:none}
.sc--macro .ov{position:relative;z-index:2;margin-top:auto;padding:0 clamp(20px,3vw,44px) clamp(24px,3vw,40px);color:#fff;pointer-events:none}
.sc--macro .lede{color:rgba(255,255,255,.86);margin-top:14px}
/* 3 — чертёж как графика: размеры крупными цифрами */
.sc--draw{background-image:linear-gradient(rgba(26,26,26,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(26,26,26,.05) 1px,transparent 1px);background-size:32px 32px}
.sc--draw .dw{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:clamp(16px,2vw,32px);align-items:center}
.sc--draw .pic--draw{background:transparent;aspect-ratio:1/1}
.sc--draw .pic--draw img{mix-blend-mode:multiply;object-fit:contain;transform:scale(1.75)}
.sc--draw .num2{font-weight:200;font-size:clamp(28px,2.6vw,46px);letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;text-wrap:balance}
.sc--draw small{display:block;margin-top:10px;font-size:12.5px;color:var(--graphite-2)}
/* 4 — пара: большое и малое фото, текст между */
.sc--duo .duo{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:end}
.sc--duo .a{grid-column:1/10;grid-row:1;aspect-ratio:4/3}
.sc--duo .b{grid-column:8/13;grid-row:1;align-self:end;aspect-ratio:3/4;margin-bottom:-14%;z-index:2;box-shadow:0 26px 54px rgba(26,26,26,.2)}
.sc--duo .tx{margin-top:clamp(56px,7vw,110px);max-width:30rem}
.sc--duo .lede{margin-top:14px}
/* 5 — автор: портрет и цитата крупно */
.sc--who .who{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(20px,3vw,48px);align-items:end}
.sc--who .pic{aspect-ratio:3/4;align-self:end}
.sc--who .pic img{object-position:50% 18%}
.sc--who blockquote{font-weight:200;font-size:clamp(24px,2.3vw,38px);line-height:1.22;letter-spacing:-.015em}
.sc--who blockquote small{display:block;margin-top:16px;font-style:italic;font-weight:300;font-size:13px;line-height:1.55;color:var(--graphite-2);letter-spacing:0}
.sc--who .n{margin-top:22px;font-size:14px}
.sc--who .n span{color:var(--graphite-2)}

.loupe{position:absolute;width:clamp(96px,9.5vw,148px);aspect-ratio:1;border-radius:50%;pointer-events:none;z-index:3;border:3px solid rgba(255,255,255,.96);
  box-shadow:0 20px 44px rgba(26,26,26,.26);background-size:cover;background-position:center;background-color:var(--paper);transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .5s var(--out),transform .7s var(--out)}
.loupe.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.loupe span{position:absolute;left:50%;top:100%;transform:translate(-50%,10px);white-space:nowrap;font-size:11px;letter-spacing:.06em;background:rgba(26,26,26,.86);color:#fff;padding:6px 11px;border-radius:999px}

/* ── описание — справа, стоит ── */
.info{position:sticky;top:var(--stick);padding:4px 2px 24px}
.fac{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.fac a:hover{color:var(--amber)}
.fac .c{color:var(--graphite-2)}
.lvl2{display:inline-flex;align-items:center;gap:7px;letter-spacing:.02em;text-transform:none;font-weight:400;font-size:12.5px;color:var(--graphite-2)}
.lvl2 i{display:inline-flex;gap:3px}
.lvl2 i b{width:5px;height:5px;border-radius:50%;background:var(--sand)}
.lvl2 i b.on{background:var(--brass)}
.info h1{font-size:clamp(30px,2.8vw,46px);font-weight:200;letter-spacing:-.025em;margin:16px 0 8px;text-wrap:balance}
.author{font-size:14px;color:var(--graphite-2)}
.author b{font-weight:400;color:var(--ink)}
.tagline{margin-top:22px;font-weight:300;font-size:clamp(16.5px,1.3vw,19px);line-height:1.5;color:var(--ink-soft);max-width:40ch;text-wrap:pretty}
.origbtn{margin-left:4px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--graphite-2);border-bottom:1px dotted currentColor;vertical-align:2px}
.orig{margin-top:10px;font-style:italic;font-weight:300;font-size:13.5px;line-height:1.55;color:var(--graphite-2);max-width:48ch;display:none}
.orig.on{display:block;animation:fade .4s var(--out)}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}}
.avail{margin-top:26px;display:flex;gap:12px;align-items:baseline;font-size:14.5px;line-height:1.5}
.avail small{display:block;color:var(--graphite-2);font-size:13px}
.avail button{color:var(--ink);border-bottom:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 4px var(--emerald-wash);flex:none;transform:translateY(-1px)}
.price{margin-top:22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.price .now{font-size:clamp(28px,2.2vw,34px);font-weight:200;letter-spacing:-.01em}
.price s{font-size:16px;color:var(--graphite-2)}
.off{font-size:11.5px;font-weight:500;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:2px 8px;align-self:center}
.promo{font-size:13px;color:var(--ink);margin-top:2px}
.pnote{font-size:12.5px;color:var(--graphite-2);margin-top:6px;max-width:44ch}
.buy{margin-top:20px}
.buy .btn{width:100%;padding:17px 24px}
.acts{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:18px;font-size:13.5px}
.acts button{display:inline-flex;align-items:center;gap:8px;color:var(--ink-soft);transition:color .2s}
.acts button:hover{color:var(--amber)}
.acc{margin-top:26px;border-top:.5px solid var(--line)}
.acc details{border-bottom:.5px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:15px 0;font-size:14.5px}
.acc summary::-webkit-details-marker{display:none}
.acc summary i{width:11px;height:11px;position:relative;flex:none}
.acc summary i::before,.acc summary i::after{content:"";position:absolute;left:0;right:0;top:5px;height:1px;background:currentColor;transition:transform .35s var(--out)}
.acc summary i::after{transform:rotate(90deg)}
.acc details[open] summary i::after{transform:rotate(0)}
.acc .in{padding:0 0 18px;font-size:14px;line-height:1.6;animation:fade .35s var(--out)}
.acc dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px}
.acc dt{color:var(--graphite-2)}
.acc dd a,.acc .links a,.acc .links button{border-bottom:1px solid var(--line)}
.acc .links{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:12px}
.acc p{color:var(--graphite)}

.more{margin-top:clamp(70px,8vw,120px)}
.more__h{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap}
.more__h h2{font-weight:200}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3*20px)/4);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:30px 0 14px;scrollbar-width:thin}
.rail>a{scroll-snap-align:start;display:flex;flex-direction:column;gap:4px}
.rail figure{margin:0 0 10px;aspect-ratio:4/5;border-radius:var(--r2);overflow:hidden;background:var(--paper)}
.rail img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:9%;transition:transform .9s var(--out)}
.rail img.cv{object-fit:cover;padding:0;mix-blend-mode:normal}
.rail>a:hover img{transform:scale(1.04)}
.rail small{font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--graphite-2)}
.rail .p{font-size:14px;color:var(--graphite)}
.invite{margin:clamp(56px,6vw,96px) 0;font-weight:200;font-size:clamp(20px,1.8vw,26px);line-height:1.45;max-width:46rem}
.invite a{border-bottom:1px solid var(--line);white-space:nowrap}

.buybar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(250,250,248,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:.5px solid var(--line);transform:translateY(110%);transition:transform .45s var(--out)}
.buybar.on{transform:none}
.buybar__i{min-width:0;flex:1}
.buybar__n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buybar__p{font-size:16px}
.lb{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;border:0;padding:0;background:#f4f1ec}
.lb::backdrop{background:rgba(20,18,15,.6)}
.lb__track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb__track::-webkit-scrollbar{display:none}
.lb__track figure{flex:0 0 100%;height:100%;scroll-snap-align:center;margin:0;display:grid;place-items:center;padding:64px clamp(16px,6vw,96px)}
.lb__track img,.lb__track video{max-width:100%;max-height:100%;object-fit:contain}
.lb__x,.lb__nav{position:absolute;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(250,250,248,.94)}
.lb__x{top:14px;right:14px}.lb__nav{top:50%;transform:translateY(-50%)}.lb__nav--p{left:14px}.lb__nav--n{right:14px}
.lb__c{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;letter-spacing:.1em}

@media(max-width:1240px){
  .split{grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr)}
  .vid{grid-column:1;grid-row:1;position:static;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0 20px;align-items:end;margin-bottom:36px}
  .vid__h{grid-column:1/-1}
  .vid__f{aspect-ratio:16/10}
  .rib{grid-column:1;grid-row:2}
  .info{grid-column:2;grid-row:1/span 2}
  .rib__nav{display:none}
}
/* телефон: первая глава, затем описание, затем остальные главы и видео */
@media(max-width:980px){
  .split{display:flex;flex-direction:column;gap:0}
  .rib{display:contents}
  .sc{order:3;min-height:0;padding:clamp(40px,10vw,64px) 0 0}
  .sc:first-of-type{order:1;padding-top:0}
  .info{order:2;position:static;max-height:none;overflow:visible;margin-top:26px}
  .vid{order:4;margin:48px 0 0;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .vid__f{aspect-ratio:4/5}
  .sc--hero .pic{max-height:none}
  .sc--macro{min-height:72vh}
  .sc--macro .pic{inset:clamp(40px,10vw,64px) 0 0}
  .sc--draw .dw,.sc--who .who{grid-template-columns:minmax(0,1fr)}
  .sc--duo .a{grid-column:1/11}
  .sc--duo .b{grid-column:7/13}
  .loupe{width:82px}
  .loupe span{font-size:10px;padding:4px 8px}
  .rail{grid-auto-columns:70%}
  .buybar{display:flex}
  body{padding-bottom:76px}
}
@media(prefers-reduced-motion:reduce){.vid__f img,.vid__h i{animation:none}.rv{opacity:1;transform:none;transition:none}.pic img{transform:none!important}}
</style>
</head>
<body data-page="catalog" data-root="../">
<div class="vbar" id="vbar"></div>
<div id="hdr"></div>
<main class="wrap" id="main"></main>
<div id="ftr"></div>
<div class="buybar" id="buybar" aria-hidden="true"></div>
<dialog class="lb" id="lb" aria-label="Просмотр">
  <div class="lb__track" id="lbTrack"></div>
  <button type="button" class="lb__x" id="lbX" aria-label="Закрыть"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button type="button" class="lb__nav lb__nav--p" id="lbP" aria-label="Назад"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button type="button" class="lb__nav lb__nav--n" id="lbN" aria-label="Вперёд"><svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="lb__c" id="lbC"></div>
</dialog>
<script src="../data/data.js?v=1792770868"></script>
<script src="../data/stock.js?v=1792770868"></script>
<script src="../assets/site.js?v=1792770868"></script>
<script>
(function () {

  /* Главы: hero · macro · draw · duo · who. Тексты — из официальных источников фабрик; переводы и заголовки — черновик. */
  const C = 'cleo/0000_PH_Col_Set_Cleo_Sofas_Indoor_', P = 'paula/2023_PH_Col_Set_Paula_Armchair', L = 'loic/';
  const X = {
    'm-p003': {
      designer: 'Vincent Van Duysen', src: 'https://www.molteni.it/it/eu/product/cleo',
      tag: 'Плавная изогнутая оболочка обнимает сиденье и спинку — и диван становится укромным местом, где тепло и спокойно.',

        { k: 'draw', nav: 'Размеры', img: 'cleo/td.jpg', side: '../img/stock/m-p003.jpg' },

  document.getElementById('lbP').onclick = () => lbGo(Math.max(0, lbI() - 1));
  document.getElementById('lbN').onclick = () => lbGo(Math.min(set.length - 1, lbI() + 1));
  lb.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') lbGo(Math.max(0, lbI() - 1)); if (e.key === 'ArrowRight') lbGo(Math.min(set.length - 1, lbI() + 1)) });
  const uniq = [...new Set(allImgs)];
  document.getElementById('main').addEventListener('click', e => { const f2 = e.target.closest('figure[data-src]'); if (f2 && f2.closest('.split')) openLb(uniq.indexOf(f2.dataset.src), uniq) });

  const SKIP = 3.2;
  const skipIntro = v => { if (v.dataset.skip) return; v.dataset.skip = 1; v.addEventListener('timeupdate', () => { if (v.currentTime < SKIP && v.duration > SKIP + 2) v.currentTime = SKIP }) };
  document.querySelectorAll('video').forEach(skipIntro);
  new MutationObserver(() => lbT.querySelectorAll('video').forEach(skipIntro)).observe(lbT, { childList: true });
})();
</script>
</body>
