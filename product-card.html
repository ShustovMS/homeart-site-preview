<style>
/* Служебная страница: тестовая карточка товара v5 — главы по экрану (подача) + закреплённое описание (как у Casa Ricca).
   Фото, видео и тексты фабрик — с официальных сайтов, только для теста. На боевой сайт не выкладывается. */
:root{--paper:#fff;--out:cubic-bezier(.23,1,.32,1);--r2:3px;--stick:28px}
.ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.t{display:inline-block;vertical-align:middle;margin-left:8px;font:600 9px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:3px 6px}

.vbar{background:var(--ink);color:#f3eee6;font-size:13px}
.vbar__in{max-width:var(--maxw);margin:0 auto;padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.vbar__t{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.vbar__tabs{display:flex;gap:4px;flex-wrap:wrap}
.vbar__tabs a{padding:6px 13px;border-radius:999px;border:.5px solid rgba(243,238,230,.32)}
.vbar__tabs a:hover{border-color:#f3eee6}
.vbar__tabs a.on{background:#f3eee6;color:var(--ink)}
.vbar__note{flex-basis:100%;color:#bdb6aa;font-size:12.5px;line-height:1.5}
.vbar__note a{border-bottom:1px solid rgba(243,238,230,.4)}

.split{display:grid;grid-template-columns:clamp(150px,12.5vw,220px) minmax(0,1.25fr) minmax(0,.8fr);gap:clamp(22px,3vw,60px);margin-top:26px;align-items:start}
.split--novid{grid-template-columns:minmax(0,1.25fr) minmax(0,.8fr)}
.split--novid .rib__nav ol{left:12px;transform:none}

/* видео — слева, стоит */
.vid{position:sticky;top:var(--stick);cursor:pointer;outline-offset:4px}
.vid__h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite);margin-bottom:12px}
.vid__h i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.vid__f{position:relative;aspect-ratio:9/16;border-radius:var(--r2);overflow:hidden;background:#1d1b18}
.vid__f video,.vid__f img{width:100%;height:100%;object-fit:cover}
.vid__f img{animation:kb 16s ease-in-out infinite alternate;filter:saturate(.85)}
@keyframes kb{from{transform:scale(1.05)}to{transform:scale(1.22) translate(-6%,-4%)}}
.vid__play{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;display:grid;place-items:center;background:rgba(250,250,248,.9);color:var(--ink);opacity:0;transition:opacity .3s}
.vid:hover .vid__play,.vid:focus-visible .vid__play{opacity:1}
.vid__soon{position:absolute;left:12px;right:12px;bottom:12px;font-size:12.5px;line-height:1.4;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.vid__c{font-size:12.5px;color:var(--graphite-2);margin-top:10px;line-height:1.45}

/* ── главы: движется только эта колонка ── */
.rib{position:relative}
.rib__nav{position:sticky;top:var(--stick);height:0;z-index:4}
.rib__nav ol{position:absolute;left:calc(-1 * clamp(11px,1.5vw,30px));transform:translateX(-50%);list-style:none;display:flex;flex-direction:column;gap:2px;padding-top:6px}
.rib__nav button{display:grid;place-items:center;width:22px;height:16px;color:var(--sand);transition:color .25s}
.rib__nav button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rib__nav button i{width:10px;height:1.5px;background:currentColor;transition:width .35s var(--out)}
.rib__nav button:hover{color:var(--graphite)}
.rib__nav button.on{color:var(--ink)}
.rib__nav button.on i{width:20px}
.sc{position:relative;min-height:calc(100vh - 2 * var(--stick));display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,4vw,56px) 0}
.sc:first-child{min-height:0;padding-top:0}
.big{font-family:var(--sans);font-weight:300;font-size:clamp(22px,1.9vw,32px);line-height:1.2;letter-spacing:0;text-transform:uppercase;text-wrap:balance}
.lede{font-size:15.5px;line-height:1.65;color:var(--graphite);max-width:40ch}
.pic{margin:0;position:relative;overflow:hidden;border-radius:var(--r2);background:var(--paper);cursor:zoom-in}
.pic img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
.pic--cut img{object-fit:contain;mix-blend-mode:multiply;padding:8%}
.pic--fit{background:#fff}.pic--fit img{object-fit:contain!important;transform:none!important}   /* фото не на белом — целиком, без обрезки */
.chipx{position:absolute;right:12px;bottom:12px;font-size:11px;padding:5px 10px;border-radius:999px;background:rgba(250,250,248,.9);color:var(--graphite)}
/* появление: слово выезжает снизу, один раз */
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s var(--out),transform 1.2s var(--out)}
.in .rv{opacity:1;transform:none}
.in .rv:nth-child(2){transition-delay:.08s}.in .rv:nth-child(3){transition-delay:.16s}

/* 1 — герой: крупное слово наезжает на фото */
/* 1 — первый кадр: только фото, предмет крупно и целиком, сразу сверху */
.sc.sc--hero{min-height:0;padding-top:0;justify-content:flex-start}
.sc--hero .pic{aspect-ratio:4/5;max-height:calc(100vh - 140px)}
.sc--hero .pic img{transition:none}
/* 2 — макро на весь блок, слово поверх */
.sc--macro .pic{position:absolute;inset:clamp(28px,4vw,56px) 0;border-radius:var(--r2)}
.sc--macro .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,15,0) 40%,rgba(20,18,15,.62) 100%);pointer-events:none}
.sc--macro .ov{position:relative;z-index:2;margin-top:auto;padding:0 clamp(20px,3vw,44px) clamp(24px,3vw,40px);color:#fff;pointer-events:none}
.sc--macro .lede{color:rgba(255,255,255,.86);margin-top:14px}
/* 3 — чертёж как графика: размеры крупными цифрами */
.sc--draw{background-image:linear-gradient(rgba(26,26,26,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(26,26,26,.05) 1px,transparent 1px);background-size:32px 32px}
.sc--draw .dw{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:clamp(16px,2vw,32px);align-items:center}
.sc--draw .pic--draw{background:transparent;aspect-ratio:1/1}
.sc--draw .pic--draw img{mix-blend-mode:multiply;object-fit:contain;transform:none}
.pic.pic--ours{aspect-ratio:auto;height:auto;background:#fff;margin-bottom:12px}
.pic.pic--ours img{position:static!important;display:block;margin:0 auto;width:auto!important;max-width:100%!important;height:auto!important;object-fit:contain!important;transform:none!important}
.sc--draw .num2{font-weight:200;font-size:clamp(28px,2.6vw,46px);letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;text-wrap:balance}
.sc--draw small{display:block;margin-top:10px;font-size:12.5px;color:var(--graphite-2)}
/* формат карточки (ТЗ_карточка_товара.md): размеры по строкам, детали, образцы */
.sc--draw .dw--r>.pic{order:-1}
.sc--draw .pic--draw{aspect-ratio:auto}.sc--draw .pic--draw img{height:auto;max-height:70vh}   /* чертёж обрезан по содержимому — во всю ширину колонки */
.dl2{display:grid;gap:22px}
.dl2 .g{display:grid;gap:6px}
.dl2 .gl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite-2);margin-bottom:2px}
.dl2 .r{display:grid;grid-template-columns:5.6em minmax(0,1fr);align-items:baseline;gap:10px}
.dl2 .r span{font-size:12.5px;color:var(--graphite-2)}
.dl2 .r b{font-weight:200;font-size:clamp(26px,2.3vw,40px);letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl2--many .r b{font-size:clamp(19px,1.5vw,24px)}
.dl2raw{font-weight:300;font-size:clamp(15px,1.2vw,18px);line-height:1.6}
.sc--draw .dnote{margin-top:22px;font-size:13px;line-height:1.55;color:var(--graphite);max-width:36ch}
.sc--draw .dnote small{margin-top:6px}
.sc--duo .duo--bare{margin-bottom:clamp(40px,9%,96px)}
.sc--duo .duo--rev .a{grid-column:4/13}.sc--duo .duo--rev .b{grid-column:1/6}   /* детали: внахлёст в другую сторону */
/* компьютер: курсор над парой фото — оба уменьшаются к своим краям и встают рядом целиком (вариант 1, 12.11.2026) */
.duo__dots{display:none}
@media (hover:hover) and (pointer:fine) and (min-width:981px){
  .sc--duo .a,.sc--duo .b{transition:transform 560ms cubic-bezier(.77,0,.175,1),box-shadow 560ms cubic-bezier(.77,0,.175,1)}
  .sc--duo .a{transform-origin:0 50%}.sc--duo .b{transform-origin:100% 100%}
  .sc--duo .duo--rev .a{transform-origin:100% 50%}.sc--duo .duo--rev .b{transform-origin:0 100%}
  .sc--duo .duo:hover .a,.sc--duo .duo:hover .b{transform:scale(.83)}
  .sc--duo .duo:hover .b{box-shadow:0 10px 24px rgba(26,26,26,.12)}
}
.sc--ours .hcap{margin-top:0}
.sc--macro--bare .pic::after{display:none}
.sc--det .det{display:grid;gap:clamp(12px,1.4vw,20px)}
.sc--det .det--2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sc--det .pic{aspect-ratio:4/3}.sc--det .det--2 .pic{aspect-ratio:3/4}
.sc--smp .smp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(14px,1.6vw,24px)}
.sc--smp .smp--1{max-width:620px}
.sc--smp .pic{aspect-ratio:1/1}
.sc--smp .pic img{object-fit:cover}
.smp__k,.hcap{font-size:13px;color:var(--graphite)}
.smp__k{margin-top:10px}.hcap{margin-top:12px}
/* 4 — пара: большое и малое фото, текст между */
.sc--duo .duo{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:end}
.sc--duo .a{grid-column:1/10;grid-row:1;aspect-ratio:4/3}
.sc--duo .b{grid-column:8/13;grid-row:1;align-self:end;aspect-ratio:3/4;margin-bottom:-14%;z-index:2;box-shadow:0 26px 54px rgba(26,26,26,.2)}
.sc--duo .tx{margin-top:clamp(56px,7vw,110px);max-width:30rem}
.sc--duo .lede{margin-top:14px}
/* 5 — автор: портрет и цитата крупно */
.sc--who .who{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(20px,3vw,48px);align-items:end}
.sc--who .pic{aspect-ratio:3/4;align-self:end}
.sc--who .pic img{object-position:50% 18%}
.sc--who blockquote{font-weight:200;font-size:clamp(24px,2.3vw,38px);line-height:1.22;letter-spacing:-.015em}
.sc--who blockquote small{display:block;margin-top:16px;font-style:italic;font-weight:300;font-size:13px;line-height:1.55;color:var(--graphite-2);letter-spacing:0}
.sc--who .n{margin-top:22px;font-size:14px}
.sc--who .n span{color:var(--graphite-2)}
.sc--who .who:has(.who__n){align-items:start}
.sc--who .who--text{grid-template-columns:minmax(0,1fr)}
.who__k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite-2)}
.who__n{margin-top:8px;font-family:var(--display);font-weight:500;font-size:clamp(22px,2vw,30px);text-transform:uppercase;line-height:1.15}
.who__r{margin-top:6px;font-size:14px;color:var(--graphite)}
.who__b{margin-top:16px;font-size:15px;line-height:1.65;color:var(--ink-soft);max-width:60ch}
.who__m{margin-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.who__m a{display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:1.3}
.who__mi{aspect-ratio:1/1;background:#fff;display:grid;place-items:center;overflow:hidden}
.who__mi img{width:100%;height:100%;object-fit:contain;padding:8%}
.who__m a:hover span:last-child{text-decoration:underline}

.loupe{position:absolute;width:clamp(96px,9.5vw,148px);aspect-ratio:1;border-radius:50%;pointer-events:none;z-index:3;border:3px solid rgba(255,255,255,.96);
  box-shadow:0 20px 44px rgba(26,26,26,.26);background-size:cover;background-position:center;background-color:var(--paper);transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .5s var(--out),transform .7s var(--out)}
.loupe.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.loupe span{position:absolute;left:50%;top:100%;transform:translate(-50%,10px);white-space:nowrap;font-size:11px;letter-spacing:.06em;background:rgba(26,26,26,.86);color:#fff;padding:6px 11px;border-radius:999px}

/* ── описание — справа, стоит ── */
.info{position:sticky;top:var(--stick);padding:4px 2px 24px}
.fac{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.fac a:hover{color:var(--amber)}
.fac .c{color:var(--graphite-2)}
.lvl2{display:inline-flex;align-items:center;gap:7px;letter-spacing:.02em;text-transform:none;font-weight:400;font-size:12.5px;color:var(--graphite-2)}
.lvl2 i{display:inline-flex;gap:3px}
.lvl2 i b{width:5px;height:5px;border-radius:50%;background:var(--sand)}
.lvl2 i b.on{background:var(--brass)}
.info h1{font-size:clamp(30px,2.8vw,46px);font-weight:200;letter-spacing:-.025em;margin:16px 0 8px;text-wrap:balance}
.author{font-size:14px;color:var(--graphite-2)}
.author b{font-weight:400;color:var(--ink)}
.tagline{margin-top:22px;font-weight:300;font-size:clamp(16.5px,1.3vw,19px);line-height:1.5;color:var(--ink-soft);max-width:40ch;text-wrap:pretty}
.origbtn{margin-left:4px;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--graphite-2);border-bottom:1px dotted currentColor;vertical-align:2px}
.orig{margin-top:10px;font-style:italic;font-weight:300;font-size:13.5px;line-height:1.55;color:var(--graphite-2);max-width:48ch;display:none}
.orig.on{display:block;animation:fade .4s var(--out)}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}}
.avail{margin-top:26px;display:flex;gap:12px;align-items:baseline;font-size:14.5px;line-height:1.5}
.avail small{display:block;color:var(--graphite-2);font-size:13px}
.avail button{color:var(--ink);border-bottom:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 4px var(--emerald-wash);flex:none;transform:translateY(-1px)}
.price{margin-top:22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.price .now{font-size:clamp(28px,2.2vw,34px);font-weight:200;letter-spacing:-.01em}
.price s{font-size:16px;color:var(--graphite-2)}
.off{font-size:11.5px;font-weight:500;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:2px 8px;align-self:center}
.promo{font-size:13px;color:var(--ink);margin-top:2px}
/* фото с подписями на кадре — целиком, в своих пропорциях */
.sc--whole{min-height:0}
.sc--whole .pic{position:relative;inset:auto}.sc--whole .pic::after{display:none}
.pic--whole{background:transparent}.pic--whole img{height:auto!important;object-fit:contain!important;transform:none!important}
/* размеры: нет нигде — только фото и мелкая подпись; есть в описании — списком рядом с фото */
.sc--draw .dw--solo{grid-template-columns:minmax(0,1fr)}
.szl{display:grid;gap:6px;font-size:15px;line-height:1.5;font-weight:300}
.szl .gl{margin-top:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite-2);font-weight:400}.szl .gl:first-child{margin-top:0}
.dot--order{background:var(--sand);box-shadow:none}
.acc .desc p{margin-top:8px}.acc .desc p:first-child{margin-top:0}
.acc .desc .dh{margin-top:14px;color:var(--ink);font-weight:500}
.acc .desc ul{margin:6px 0 0;padding-left:18px;color:var(--graphite)}.acc .desc li{margin-top:3px}
.pnote{font-size:12.5px;color:var(--graphite-2);margin-top:6px;max-width:44ch}
.buy{margin-top:20px}
.buy .btn{width:100%;padding:17px 24px}
.acts{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:18px;font-size:13.5px}
.acts button{display:inline-flex;align-items:center;gap:8px;color:var(--ink-soft);transition:color .2s}
.acts button:hover{color:var(--amber)}
.acc{margin-top:26px;border-top:.5px solid var(--line)}
.acc details{border-bottom:.5px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:15px 0;font-size:14.5px}
.acc summary::-webkit-details-marker{display:none}
.acc summary i{width:11px;height:11px;position:relative;flex:none}
.acc summary i::before,.acc summary i::after{content:"";position:absolute;left:0;right:0;top:5px;height:1px;background:currentColor;transition:transform .35s var(--out)}
.acc summary i::after{transform:rotate(90deg)}
.acc details[open] summary i::after{transform:rotate(0)}
.acc .in{padding:0 0 18px;font-size:14px;line-height:1.6;animation:fade .35s var(--out)}
.acc dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px}
.acc dt{color:var(--graphite-2)}
.acc dd a,.acc .links a,.acc .links button{border-bottom:1px solid var(--line)}
.acc .links{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:12px}
.acc p{color:var(--graphite)}

.more{margin-top:clamp(70px,8vw,120px)}
.more__h{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap}
.more__h h2{font-weight:200}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3*20px)/4);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:30px 0 14px;scrollbar-width:thin}
.rail>a{scroll-snap-align:start;display:flex;flex-direction:column;gap:4px}
.rail figure{margin:0 0 10px;aspect-ratio:4/5;border-radius:var(--r2);overflow:hidden;background:var(--paper)}
.rail img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:9%;transition:transform .9s var(--out)}
.rail img.cv{object-fit:cover;padding:0;mix-blend-mode:normal}
.rail>a:hover img{transform:scale(1.04)}
.rail small{font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--graphite-2)}
.rail .p{font-size:14px;color:var(--graphite)}
.invite{margin:clamp(56px,6vw,96px) 0;font-weight:200;font-size:clamp(20px,1.8vw,26px);line-height:1.45;max-width:46rem}
.invite a{border-bottom:1px solid var(--line);white-space:nowrap}

.buybar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(250,250,248,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:.5px solid var(--line);transform:translateY(110%);transition:transform .45s var(--out)}
.buybar.on{transform:none}
.buybar__i{min-width:0;flex:1}
.buybar__n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buybar__p{font-size:16px}
.lb{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;border:0;padding:0;background:#f4f1ec}
.lb::backdrop{background:rgba(20,18,15,.6)}
.lb__track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb__track::-webkit-scrollbar{display:none}
.lb__track figure{flex:0 0 100%;height:100%;scroll-snap-align:center;margin:0;display:grid;place-items:center;padding:64px clamp(16px,6vw,96px)}
.lb__track img,.lb__track video{max-width:100%;max-height:100%;object-fit:contain}
.lb__x,.lb__nav{position:absolute;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(250,250,248,.94)}
.lb__x{top:14px;right:14px}.lb__nav{top:50%;transform:translateY(-50%)}.lb__nav--p{left:14px}.lb__nav--n{right:14px}
.lb__c{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;letter-spacing:.1em}

@media(max-width:1240px){
  .split{grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr)}
  .vid{grid-column:1;grid-row:1;position:static;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0 20px;align-items:end;margin-bottom:36px}
  .vid__h{grid-column:1/-1}
  .vid__f{aspect-ratio:16/10}
  .rib{grid-column:1;grid-row:2}
  .info{grid-column:2;grid-row:1/span 2}
  .split--novid .rib,.split--novid .info{grid-row:1}
  .rib__nav{display:none}
}
/* телефон: первая глава, затем описание, затем остальные главы и видео */
@media(max-width:980px){
  .split{display:flex;flex-direction:column;gap:0}
  .rib{display:contents}
  .sc{order:3;min-height:0;padding:clamp(40px,10vw,64px) 0 0}
  .sc:first-of-type{order:1;padding-top:0}
  .info{order:2;position:static;max-height:none;overflow:visible;margin-top:26px}
  .vid{order:4;margin:48px 0 0;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .vid__f{aspect-ratio:4/5}
  .sc--hero .pic{max-height:none}
  .sc--macro{min-height:72vh}
  .sc--macro .pic{inset:clamp(40px,10vw,64px) 0 0}
  .sc--whole{min-height:0}.sc--whole .pic{inset:auto}
  .sc--draw .dw,.sc--who .who{grid-template-columns:minmax(0,1fr)}
  .sc--draw .dw[style]{grid-template-columns:minmax(0,1fr)!important}   /* фото рядом с размерами: колонки задаёт атрибут style — на телефоне одна колонка, иначе цифры уходят под фото (13.11) */
  /* телефон: пара фото — лента во всю ширину экрана, листается пальцем, следующее выглядывает (вариант 5) */
  .sc--duo .duo{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * var(--gutter));padding:0 var(--gutter);scroll-padding:0 var(--gutter)}
  .sc--duo .duo::-webkit-scrollbar{display:none}
  .sc--duo .duo .a,.sc--duo .duo .b{flex:0 0 84%;margin:0;aspect-ratio:4/5;box-shadow:none;scroll-snap-align:center}
  .sc--duo .duo--bare{margin-bottom:0}
  .duo__dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
  .duo__dots i{width:6px;height:6px;border-radius:50%;background:var(--sand);transition:background .2s}
  .duo__dots i.on{background:var(--ink)}
  .sc--ours .hcap{margin-top:12px}
  .loupe{width:82px}
  .loupe span{font-size:10px;padding:4px 8px}
  .rail{grid-auto-columns:70%}
  .buybar{display:flex}
  body{padding-bottom:76px}
}
.gal{display:none}
@media(max-width:980px){
  /* телефон: все фото одной лентой сверху (вариант А, Михаил 13.11) — одна высота, каждое фото целиком, следующее выглядывает справа */
  .gal{display:block;order:1;position:relative;margin:0 calc(-1 * var(--gutter));width:calc(100% + 2 * var(--gutter));min-width:0;--gh:min(110vw,66vh)}
  .gal__t{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 var(--gutter);scroll-padding:0 var(--gutter)}
  .gal__t::-webkit-scrollbar{display:none}
  .gal__t figure{flex:0 0 auto;height:var(--gh);margin:0;scroll-snap-align:start;border-radius:3px;overflow:hidden;cursor:zoom-in;aspect-ratio:var(--r,.8)}
  .gal__t figure img{width:100%;height:100%;object-fit:contain;display:block}
  .gal__t figure.fit{width:86vw;aspect-ratio:auto;background:#fff}.gal__t figure.fit img{padding:4% 2%}   /* фото на белом уже обрезаны по предмету — без лишних полей, крупнее (Brera, 13.11) */
  .gal__hint{position:absolute;left:calc(var(--gutter) + 10px);top:calc(var(--gh) - 40px);z-index:2;font-size:12px;background:var(--ink);color:#fff;border-radius:99px;padding:5px 12px;pointer-events:none}
  .gal__hint b{font-weight:500}.gal__hint i{display:inline-block;font-style:normal;animation:galNudge 1.4s ease-in-out infinite}
  @keyframes galNudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
  /* подсказка «листается»: один раз кадры чуть уходят влево и возвращаются — без прокрутки ленты */
  .gal__t--peek figure{animation:galPeek 1.1s cubic-bezier(.45,0,.25,1) 1.3s 1}
  @keyframes galPeek{0%,100%{transform:none}45%{transform:translateX(-46px)}}
  .gal__bar{height:2px;background:var(--sand);margin:12px var(--gutter) 0;position:relative;overflow:hidden;border-radius:2px}
  .gal__bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:left .25s}
  .gal__cap{margin:10px var(--gutter) 0;font-size:13px;color:var(--graphite);min-height:1em}.gal__cap:empty{display:none}
  /* подсказка, что ниже есть размеры, отделки и характеристики (Михаил, 13.11) — мелко, не спорит с фото */
  .gal__more{margin:10px var(--gutter) 0;font-size:12.5px;line-height:1.6;color:var(--graphite)}
  .gal__more button{font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;border-bottom:1px dotted var(--sand)}
  .gal__more i{font-style:normal;display:inline-block;margin-left:4px;animation:galDown 1.8s ease-in-out infinite}
  @keyframes galDown{0%,100%{transform:none}50%{transform:translateY(3px)}}
  .split.has-gal .sc--ingal,.split.has-gal .loupe{display:none}
}
@media(prefers-reduced-motion:reduce){.gal__hint i,.gal__more i,.gal__t--peek figure{animation:none}.sc--duo .a,.sc--duo .b{transition:none}.vid__f img,.vid__h i{animation:none}.rv{opacity:1;transform:none;transition:none}.pic img{transform:none!important}}

    <div class="split${vid ? '' : ' split--novid'}">${vid}${rib}${info}</div>${more}${invite}`;

  /* ── телефон: все фото одной лентой сверху (вариант А, Михаил 13.11). Главы, где только фото, на телефоне прячутся;
     главы с текстом, размеры, образцы и автор остаются. Подпись кадра («Экземпляр в наличии · …») — под лентой ── */
  (() => {
    const split = document.querySelector('.split'), list = [], seen = new Set();
    [...split.querySelectorAll('.sc')].filter(s => !s.matches('.sc--draw,.sc--smp,.sc--who') && !s.querySelector('.ov,.tx')).forEach(s => {
      const cap = (s.querySelector(':scope > .hcap, :scope > p') || {}).textContent || '';
      s.classList.add('sc--ingal');
      s.querySelectorAll('figure[data-src]').forEach(f => { if (!seen.has(f.dataset.src)) { seen.add(f.dataset.src); list.push({ src: f.dataset.src, fit: s.classList.contains('sc--hero'), cap }) } });
    });
    if (list.length < 2) { split.querySelectorAll('.sc--ingal').forEach(s => s.classList.remove('sc--ingal')); return }
    const g = document.createElement('div'); g.className = 'gal';
    g.innerHTML = `<div class="gal__t" tabindex="0" aria-label="Фото: ${list.length}, листаются в сторону">${list.map((it, i) =>
      `<figure data-src="${it.src}" class="${it.fit ? 'fit' : ''}"><img src="${it.src}" alt="${i ? '' : esc(p.brand + ' ' + p.name)}"${i > 1 ? ' loading="lazy"' : ''}></figure>`).join('')}</div>
      <span class="gal__hint" aria-hidden="true"><b>1 / ${list.length}</b> · Листайте <i>→</i></span><div class="gal__bar"><i style="width:${100 / list.length}%"></i></div><p class="gal__cap">${esc(list[0].cap)}</p>`;
    // что есть ниже ленты — строка со ссылками: размеры, отделки, характеристики, автор
    const fin = split.querySelector('.sc--smp') || [...document.querySelectorAll('.info .desc .dh')].find(e => /отделк/i.test(e.textContent));
    const spec = [...document.querySelectorAll('.info details')].find(d => /Характеристики/.test(d.querySelector('summary').textContent));
    const jump = [['Размеры', split.querySelector('.sc--draw:not(.sc--nosize)')], [fin && fin.matches('.sc--smp') ? 'Образцы отделок' : 'Отделки', fin],
      ['Характеристики', spec], ['Автор', split.querySelector('.sc--who')]].filter(j => j[1]);
    if (jump.length) {
      const m = document.createElement('p'); m.className = 'gal__more';
      m.innerHTML = 'Ниже: ' + jump.map((j, i) => `<button type="button" data-j="${i}">${j[0]}</button>`).join(' · ') + '<i aria-hidden="true">↓</i>';
      m.onclick = e => { const b = e.target.closest('button'); if (!b) return; const el = jump[+b.dataset.j][1];
        if (el.tagName === 'DETAILS') el.open = true;
        const hdr = document.querySelector('.hdr, header'); scrollTo({ top: el.getBoundingClientRect().top + scrollY - (hdr ? hdr.offsetHeight : 64) - 14, behavior: 'smooth' }) };
      g.appendChild(m);
    }
    split.prepend(g); split.classList.add('has-gal');
    const t = g.firstElementChild, figs = [...t.children], hint = g.querySelector('.gal__hint'), bar = g.querySelector('.gal__bar i'), cap = g.querySelector('.gal__cap');
    // ширина кадра — по пропорции фото (интерьер целиком), не шире двух высот
    figs.forEach(f => { if (f.classList.contains('fit')) return; const im = f.firstElementChild;
      const set = () => f.style.setProperty('--r', Math.min(im.naturalWidth / im.naturalHeight, 2).toFixed(3)); im.complete && im.naturalWidth ? set() : im.addEventListener('load', set) });
    let last = 0;
    t.addEventListener('scroll', () => {
      const x = t.scrollLeft + 4; let i = 0; figs.forEach((f, j) => { if (f.offsetLeft - figs[0].offsetLeft <= x) i = j });
      if (t.scrollLeft + t.clientWidth >= t.scrollWidth - 4) i = figs.length - 1;
      if (i === last) return; last = i;
      hint.innerHTML = `<b>${i + 1} / ${list.length}</b>` + (i ? '' : ' · Листайте <i>→</i>');
      bar.style.left = (i * 100 / list.length) + '%'; cap.textContent = list[i].cap;
    }, { passive: true });
    // лента всегда открывается с первого фото (Михаил, 13.11: на iPhone открывалась с середины или с последнего).
    // Safari при программной прокрутке ленты с примагничиванием уезжал к следующему кадру, а при подгрузке фото (меняется
    // ширина кадров) перепрыгивал — поэтому подсказка теперь без прокрутки (кадры чуть сдвигаются анимацией и возвращаются),
    // а пока человек сам не тронул ленту, она держится на первом кадре
    let touched = false;
    ['pointerdown', 'touchstart', 'wheel', 'keydown'].forEach(ev => t.addEventListener(ev, () => { touched = true; t.classList.remove('gal__t--peek') }, { passive: true }));
    const home = () => { if (!touched && t.scrollLeft) t.scrollLeft = 0 };
    figs.forEach(f => f.firstElementChild.addEventListener('load', home));
    addEventListener('load', home); addEventListener('pageshow', home);
    if (matchMedia('(max-width:980px)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) t.classList.add('gal__t--peek');
  })();

  const ob = document.getElementById('origBtn');
  if (ob) ob.onclick = () => { const o = document.getElementById('orig'); const on = !o.classList.contains('on'); o.classList.toggle('on', on); ob.setAttribute('aria-expanded', on) };

  /* ── пара фото на телефоне — лента: точки показывают, какое фото на экране ── */
  document.querySelectorAll('.sc--duo .duo').forEach(d => {
    const dots = document.createElement('div'); dots.className = 'duo__dots'; dots.innerHTML = '<i class="on"></i><i></i>'; d.after(dots);
    d.addEventListener('scroll', () => { const i = Math.round(d.scrollLeft / Math.max(1, d.scrollWidth - d.clientWidth)); [...dots.children].forEach((x, k) => x.classList.toggle('on', k === i)) }, { passive: true });
  });

  /* ── лупа на первой главе: настоящий макро-снимок ── */
  const scs = [...document.querySelectorAll('.sc')], loupe = document.getElementById('loupe'), ribEl = document.getElementById('rib');
  const heroPh = scs[0].querySelector('.pic'), heroImg = heroPh.querySelector('img');
  let loupeOn = false;
  const placeLoupe = () => {
    const r = heroPh.getBoundingClientRect(), s = (getComputedStyle(ribEl).display === 'contents' ? document.querySelector('.split') : ribEl).getBoundingClientRect();
    // лупа — в верхнем углу фото, на пустом месте, чтобы не закрывать предмет
    const half = loupe.offsetWidth / 2, gap = 18, right = x.loupe.corner !== 'left';
    loupe.style.left = (r.left - s.left + (right ? r.width - half - gap : half + gap)) + 'px';
    loupe.style.top = (r.top - s.top + half + gap) + 'px';
  };
  // в лупе — обивка: целый макро-кадр или увеличенный участок настоящего снимка высокого разрешения
  const showLoupe = () => {
    if (!x.loupe) return;
    placeLoupe(); loupe.style.backgroundImage = `url("${src(x.loupe.img)}")`;
    loupe.style.backgroundSize = x.loupe.size || 'cover'; loupe.style.backgroundPosition = x.loupe.pos || 'center';
    loupe.classList.add('on'); loupeOn = true;
  };
  if (getComputedStyle(ribEl).display === 'contents') document.querySelector('.split').style.position = 'relative', document.querySelector('.split').appendChild(loupe);
  const start = () => setTimeout(() => { if (scrollY < innerHeight * .5) showLoupe() }, 1300);
  heroImg.complete ? start() : heroImg.addEventListener('load', start);

  /* образцы и детали: маленькое фото не растягиваем — показываем не крупнее его разрешения (ТЗ, раздел 2) */
  document.querySelectorAll('.sc--smp .pic img, .sc--det .pic img').forEach(im => {
    const fit = () => { const fg = im.closest('.pic'); if (im.naturalWidth && im.naturalWidth / 1.25 < fg.clientWidth) fg.style.maxWidth = Math.round(im.naturalWidth / 1.25) + 'px' };
    im.complete ? fit() : im.addEventListener('load', fit);
  });

  /* ── прокрутка: появление, лёгкое движение фото, активная глава, панель на телефоне ── */
  const navBtns = [...document.querySelectorAll('[data-go]')];
  navBtns.forEach(b => b.onclick = () => scrollTo({ top: scs[+b.dataset.go].getBoundingClientRect().top + scrollY - 20, behavior: 'smooth' }));
  const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const bar = document.getElementById('buybar'), cta = document.getElementById('mainCta'), narrow = matchMedia('(max-width:980px)');
  bar.innerHTML = `<div class="buybar__i"><div class="buybar__n">${esc(p.brand)} · ${esc(p.name)}</div><div class="buybar__p num">${p.order ? 'Цена по запросу' : fmt.eur(p.price)}</div></div>
    <button type="button" class="btn" data-call="${p.order ? 'Цена по запросу' : 'Бронь из наличия'}: ${esc(what)}">${p.order ? 'Запросить' : 'Забронировать'}</button>`;
  let tick = false;
  const sync = () => {
    tick = false; const vh = innerHeight; let act = 0;
    scs.forEach((s, i) => {
      const r = s.getBoundingClientRect();
      if (r.top < vh * .85) s.classList.add('in');
      if (r.top < vh * .45) act = i;
      if (!still && !s.classList.contains('sc--who')) { const k = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / vh)); s.querySelectorAll('.pic:not(.pic--cut):not(.pic--draw):not(.pic--ours):not(.pic--fit):not(.pic--whole) img:not([style*="object-position"])').forEach(im => im.style.transform = `translateY(${(k * 5).toFixed(2)}%) scale(1.1)`) }
    });
    const cur = navBtns.map(b => +b.dataset.go).filter(g => g <= act).pop();   // у двух кадров «Интерьера» одна кнопка
    navBtns.forEach(b => b.classList.toggle('on', +b.dataset.go === cur));
    if (loupeOn && scrollY > vh * .6) { loupe.classList.remove('on'); loupeOn = false }
    const on = narrow.matches && cta.getBoundingClientRect().bottom < 0; bar.classList.toggle('on', on); bar.setAttribute('aria-hidden', String(!on));
  };
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(sync) } }, { passive: true });
  /* ── закреплённые колонки встают под шапкой сайта (если она закреплена);
        высокая колонка описания сначала прокручивается до конца и только потом закрепляется — ничего не обрезается ── */
  const infoEl = document.getElementById('info'), hdrEl = document.querySelector('.hdr');
  const layoutSticky = () => {
    const hp = hdrEl ? getComputedStyle(hdrEl).position : '';
    const stick = (hdrEl && (hp === 'sticky' || hp === 'fixed') ? hdrEl.offsetHeight : 0) + 24;
    document.documentElement.style.setProperty('--stick', stick + 'px');
    if (narrow.matches) { infoEl.style.top = ''; return }
    const room = innerHeight - stick - 24;
    infoEl.style.top = (infoEl.offsetHeight > room ? innerHeight - infoEl.offsetHeight - 24 : stick) + 'px';
  };
  document.querySelectorAll('.acc details').forEach(d => d.addEventListener('toggle', layoutSticky));
  addEventListener('resize', () => { layoutSticky(); sync(); if (loupeOn) placeLoupe() });
  addEventListener('load', layoutSticky);
  layoutSticky();
  sync();

  /* ── видео ── */
  const vd = document.getElementById('vid');
  const openVid = () => x.video ? openLb(0, ['video:' + D + x.video]) : toast('Видео из шоурума появится позже.');
  if (vd) vd.onclick = openVid, vd.onkeydown = e => { if (e.key === 'Enter') openVid() };

  document.getElementById('share').onclick = async () => {
    try {
      if (navigator.share) { await navigator.share({ title: `${p.name} · ${p.brand}`, url: location.href }); return }
      await navigator.clipboard.writeText(location.href); toast('Ссылка скопирована — отправьте её клиенту.');
    } catch (e) { if (e && e.name !== 'AbortError') toast('Скопируйте адрес страницы из строки браузера.') }
  };

  /* ── просмотр во весь экран ── */
  const lb = document.getElementById('lb'), lbT = document.getElementById('lbTrack'), lbC = document.getElementById('lbC');
  let set = [];
  const lbI = () => Math.round(lbT.scrollLeft / (lbT.clientWidth || 1));
  const lbGo = i => { lbT.scrollTo({ left: i * lbT.clientWidth }); lbC.textContent = set.length > 1 ? `${i + 1} / ${set.length}` : '' };
  lbT.addEventListener('scroll', () => { if (set.length > 1) lbC.textContent = `${lbI() + 1} / ${set.length}` }, { passive: true });
  function openLb(i, list) {
    set = list;
    lbT.innerHTML = set.map(s => s.startsWith('video:') ? `<figure><video src="${s.slice(6)}" controls autoplay loop playsinline></video></figure>` : `<figure><img src="${s}" alt=""></figure>`).join('');
    ['lbP', 'lbN'].forEach(k => document.getElementById(k).hidden = set.length < 2);
    if (typeof lb.showModal === 'function') { lb.showModal(); document.body.style.overflow = 'hidden'; lbGo(Math.max(0, i)) }
  }
  lb.addEventListener('close', () => { document.body.style.overflow = ''; lbT.innerHTML = '' });
  document.getElementById('lbX').onclick = () => lb.close();
  document.getElementById('lbP').onclick = () => lbGo(Math.max(0, lbI() - 1));
  document.getElementById('lbN').onclick = () => lbGo(Math.min(set.length - 1, lbI() + 1));
  lb.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') lbGo(Math.max(0, lbI() - 1)); if (e.key === 'ArrowRight') lbGo(Math.min(set.length - 1, lbI() + 1)) });
  const uniq = [...new Set(allImgs)];
  document.getElementById('main').addEventListener('click', e => { const f2 = e.target.closest('figure[data-src]'); if (f2 && f2.closest('.split')) openLb(uniq.indexOf(f2.dataset.src), uniq) });

  const SKIP = 3.2;
  const skipIntro = v => { if (v.dataset.skip) return; v.dataset.skip = 1; v.addEventListener('timeupdate', () => { if (v.currentTime < SKIP && v.duration > SKIP + 2) v.currentTime = SKIP }) };
  document.querySelectorAll('video').forEach(skipIntro);
  new MutationObserver(() => lbT.querySelectorAll('video').forEach(skipIntro)).observe(lbT, { childList: true });
})();
</script>
</body>
</html>
