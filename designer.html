<script>
(function () {
  const { esc, qs } = HA;
  const d = DESIGNERS.find(x => x.id === qs.get('id')) || DESIGNERS[0];
  const list = d.projects.map(id => PROJECTS.find(x => x.id === id)).filter(Boolean);
  PJ.meta(d.meta.title, d.meta.description, d.portrait || (list[0] && list[0].photos[0]));
  document.getElementById('main').innerHTML = `
    <div class="crumbs"><a href="index.html">Главная</a><span>/</span><a href="projects.html?tab=designers">Дизайнеры</a><span>/</span><span>${esc(d.name)}</span></div>
    <div class="dhead">
      ${d.portrait ? `<div class="dhead__p"><img src="${d.portrait}" alt="${esc(d.name)}"></div>` : '<div></div>'}
      <div><div class="eyebrow">${list.length > 1 ? 'Дизайнеры и архитекторы' : 'Дизайнер'}</div><h1>${esc(d.name)}</h1>
        ${d.role ? `<p class="lead">${esc(d.role)}</p>` : ''}
        <p class="small muted" style="margin-top:14px">${HA.fmt.plural(list.length, 'проект', 'проекта', 'проектов')} с HOMEART</p></div>
    </div>
    <section class="pmore" style="padding-bottom:clamp(64px,7vw,110px)"><div class="sec__h"><h2>Проекты</h2><a class="link" href="projects.html">Все проекты →</a></div>
      <div class="ptiles">${PJ.tiles(list)}</div></section>`;
})();
</script>
