<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проект — HOMEART</title>
<meta name="description" content="">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<meta property="og:type" content="article">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap">
<link rel="stylesheet" href="assets/fonts.css?v=1793390595">
<link rel="stylesheet" href="assets/site.css?v=1793390595">
<link rel="stylesheet" href="assets/projects.css?v=1793390595">
</head>
<body data-page="projects" data-root="">
<div id="hdr"></div>
<main id="main"></main>
<div id="ftr"></div>
<dialog class="plb" id="lb" aria-label="Фото проекта"><div class="plb__t" id="lbT"></div>
  <button type="button" class="x" id="lbX" aria-label="Закрыть">×</button><button type="button" class="pv" id="lbP" aria-label="Назад">‹</button>
  <button type="button" class="nx" id="lbN" aria-label="Вперёд">›</button><div class="c" id="lbC"></div></dialog>
<script src="data/data.js?v=1793390595"></script>
<script src="data/projects.js?v=1793390595"></script>
<script src="assets/site.js?v=1793390595"></script>
<script src="assets/projects.js?v=1793390595"></script>
<script>
(function () {
  const { esc, qs } = HA;
  // формат страницы — как на старом homeart.pro: баннер-слайдер → название и автор → текст и портрет → логотипы фабрик → галерея
  const p = PROJECTS.find(x => x.id === qs.get('id')) || PROJECTS[0];
  const d = DESIGNERS.find(x => x.projects.includes(p.id));
  const slides = p.slides.length ? p.slides : p.photos.slice(0, 1);
  const all = slides.concat(p.gallery);   // порядок для просмотра во весь экран
  PJ.meta(p.meta.title, p.meta.description, slides[0]);
  const author = d ? `<a href="designer.html?id=${encodeURIComponent(d.id)}">${esc(p.author)}</a>` : esc(p.author);
  const more = (d ? d.projects.filter(id => id !== p.id).map(id => PROJECTS.find(x => x.id === id)).filter(Boolean) : [])
    .concat(PROJECTS.filter(x => x.id !== p.id && !(d && d.projects.includes(x.id)))).slice(0, 2);
  document.getElementById('main').innerHTML = `
    <section class="pban" data-hdr-over aria-label="Фото проекта">
      ${slides.map((s, i) => `<figure class="${i ? '' : 'on'}" data-i="${i}"><img src="${s}" alt="${esc(p.title)}, фото ${i + 1}" ${i ? 'loading="lazy"' : ''}></figure>`).join('')}
      ${slides.length > 1 ? `<div class="pban__dots">${slides.map((s, i) => `<button type="button" class="${i ? '' : 'on'}" data-s="${i}" aria-label="Фото ${i + 1}"></button>`).join('')}</div>` : ''}
    </section>
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Главная</a><span>/</span><a href="projects.html">Проекты</a><span>/</span><span>${esc(p.title)}</span></div>
      <h1 class="ptitle">${esc(p.h1 || p.title)}</h1>
      ${p.author ? `<p class="pby">${author}</p>` : ''}
      <div class="pbody">
        <div class="ptext">${p.text.map(t => t.startsWith('## ') ? `<h2>${esc(t.slice(3))}</h2>` : `<p>${esc(t)}</p>`).join('')}
          <button type="button" class="btn" data-call="Проект: ${esc(p.title)}" style="margin-top:28px">Обсудить проект</button></div>
        ${p.authorPhoto ? `<figure class="pportrait"><img src="${p.authorPhoto}" alt="${esc(p.author)}"></figure>` : ''}
      </div>
      ${p.logos.length ? `<div class="plogos" aria-label="Фабрики в проекте">${p.logos.map(l => `<span><img loading="lazy" src="${l}" alt=""></span>`).join('')}</div>` : ''}
    </div>
    ${p.gallery.length ? `<section class="pgal" aria-label="Галерея проекта"><div class="pgal__in">${p.gallery.map((s, i) =>
      `<figure data-i="${slides.length + i}"><img loading="lazy" src="${s}" alt="${esc(p.title)}, фото ${slides.length + i + 1}"></figure>`).join('')}</div></section>` : ''}
    ${more.length ? `<div class="wrap"><section class="pmore"><div class="sec__h"><h2>${d && d.projects.length > 1 ? 'Ещё проекты автора' : 'Другие проекты'}</h2><a class="link" href="projects.html">Все проекты →</a></div>
      <div class="ptiles">${PJ.tiles(more)}</div></section></div>` : ''}`;
  PJ.lightbox(all);
  PJ.slider(document.querySelector('.pban'));
})();
</script>
</body>
</html>
