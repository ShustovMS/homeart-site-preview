<body data-page="projects" data-root="">
<div id="hdr"></div>
<main class="wrap" id="main"></main>
<div id="ftr"></div>
<dialog class="plb" id="lb" aria-label="Фото проекта"><div class="plb__t" id="lbT"></div>
  <button type="button" class="x" id="lbX" aria-label="Закрыть">×</button><button type="button" class="pv" id="lbP" aria-label="Назад">‹</button>
  <button type="button" class="nx" id="lbN" aria-label="Вперёд">›</button><div class="c" id="lbC"></div></dialog>
<script src="data/data.js?v=1792770868"></script>

<script src="assets/projects.js?v=1792770868"></script>
<script>
(function () {
  const { esc, qs, factory } = HA;
  const p = PROJECTS.find(x => x.id === qs.get('id')) || PROJECTS[0];
  const d = DESIGNERS.find(x => x.projects.includes(p.id));
  PJ.meta(p.meta.title, p.meta.description, p.photos[0]);
  const facs = p.factories.map(factory).filter(Boolean);
  const author = d ? `<a href="designer.html?id=${encodeURIComponent(d.id)}">${esc(p.author || d.name)}</a>` : esc(p.author);
  const more = (d ? d.projects.filter(id => id !== p.id).map(id => PROJECTS.find(x => x.id === id)).filter(Boolean) : [])
    .concat(PROJECTS.filter(x => x.id !== p.id && !(d && d.projects.includes(x.id)))).slice(0, 4);
  document.getElementById('main').innerHTML = `
    <div class="crumbs"><a href="index.html">Главная</a><span>/</span><a href="projects.html">Проекты</a><span>/</span><span>${esc(p.title)}</span></div>
    <div class="pagehead" style="padding-bottom:0"><div class="eyebrow">Проект</div><h1>${esc(p.title)}</h1>
      ${p.author ? `<div class="pauthor">${p.authorPhoto ? `<img src="${p.authorPhoto}" alt="${esc(p.author)}">` : ''}<p class="lead">${author}</p></div>` : ''}</div>
    ${p.photos[0] ? `<figure class="phero" data-i="0"><img src="${p.photos[0]}" alt="${esc(p.title)}"></figure>` : ''}
    <div class="pbody">
      <div class="ptext">${p.text.map(t => `<p>${esc(t)}</p>`).join('')}</div>
      <aside class="pside">
        ${facs.length ? `<div><h4>Фабрики в проекте</h4><div class="pfac">${facs.map(f => `<a href="factory.html?id=${f.id}">${esc(f.name)}</a>`).join('')}</div></div>` : ''}
        <div><h4>Для вашего проекта</h4><p class="small muted" style="margin-bottom:12px">Подберём мебель, свет и кухню под ваш интерьер.</p>
          <button type="button" class="btn" data-call="Проект: ${esc(p.title)}">Обсудить проект</button></div>
      </aside>
    </div>
    ${p.photos.length > 1 ? `<div class="pgal">${p.photos.slice(1).map((s, i) => `<figure data-i="${i + 1}"><img loading="lazy" src="${s}" alt="${esc(p.title)}, фото ${i + 2}"></figure>`).join('')}</div>` : ''}
    ${more.length ? `<section class="pmore"><div class="sec__h"><h2>${d && d.projects.length > 1 ? 'Ещё проекты автора' : 'Другие проекты'}</h2><a class="link" href="projects.html">Все проекты →</a></div>
      <div class="ptiles">${PJ.tiles(more.slice(0, 2))}</div></section>` : ''}`;
  PJ.lightbox(p.photos);
})();
</script>
</body>
</html>
