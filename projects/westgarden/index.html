<main id="main"><noscript><div class="wrap"><h1>ЖК WEST GARDEN</h1><p>Квартира на западе Москвы с 3 спальнями Общая площадь проекта — 117 м² Планировка: мастер зона со спальней, гардеробной и ванной в одном крыле, две детские…</p><p>Квартира на западе Москвы с 3 спальнями</p><p>Общая площадь проекта — 117 м²</p><p>Планировка: мастер зона со спальней, гардеробной и ванной в одном крыле, две детские комнаты с санузлом во втором крыле и общее центральное пространство - объединенная зона гостиной и кухни.</p><p>Дизайн проекта построен на контрастах светлых и темных оттенков, острых и скругленных углов, и сочетании разнообразных фактур в отделке.</p><p>Особое место в квартире занимает искусство. Работа Кирилла Басалаева из серии AB 9.O, представленная в рамках арт направления HOMEART стала основным акцентом в зоне открытой кухни-столовой. Над барной зоной установлен уже ставший бестселлером светильник Flos «Coordinates», дизайн от Майкла Анастасиадеса. В зоне гостиной расположился еще один культовый настольный светильник Flos Taccia.</p><p>Кухня: полубарные стулья Black Tie в цвете бордо, золотая люстра Flos.</p><p>Гостиная: настольный светильник Flos (на окне).</p><p>Мастер-спальня: кровать Veneran mobili.</p><p>Спальня девочки: пуф-столик «Beetle» Imperfetto lab.</p><p>Спальня мальчик: прикроватный столик «Picea» Molteni&amp;C.</p></div></noscript></main>
