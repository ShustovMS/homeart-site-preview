<main id="main"><noscript><div class="wrap"><h1>ЧАСТНЫЙ ДОМ
В ПОДМОСКОВЬЕ</h1><p>Двухэтажный загородный дом в Подмосковье для большой семьи. Общая площадь проекта — 800 м².</p><p>Двухэтажный загородный дом в Подмосковье для большой семьи.</p><p>Общая площадь проекта — 800 м².</p><p>Основная концепция проекта — диалог пространства с окружающей природой: лаконичная архитектура, панорамные окна и современный интерьер с использованием натуральных материалов: дерево, камень, керамика, а также шерсть, шелк, лен и хлопок.</p><p>Для большой семьи были организованы общие пространства (просторная гостиная, кухня и зона барбекю внутри дома), отдельные спальни для хозяев дома и их детей, а также - собственный спа-комплекс с 12-метровым бассейном, хаммамом и сауной.</p><p>«Мы целиком декорировали этот интерьер, — говорит Олеся Голова. — Подобрали искусство, декор, а также собрали коллекцию книг для библиотеки. Особенно мне нравится картина Кирилла Басалаева, она нашла свое место в гостиной»</p><p>Гостиная: диван Flexform, стеллаж Baxter, настольные лампы Visual Comfort, кофейный столик Poliform.</p><p>Зона барбекю: обеденный стол Catellan Italia, кресла Kartell, барная стойка с ярко-оранжевыми барными стульями и подвесными светильниками Forestier.</p><p>Кухня и столовая: мрамором Bidasar Brown, обеденный стол и стулья Catellan Italia, светильник Moooi.</p><p>Мастер-спальня: кровать Woodfans, прикроватные тумбы Poliform, настольные лампы и светильник Visual Comfort, ковер Dovlet House.</p><p>Ванная комната при спальне хозяев: жалюзи на заказ Art Vintage, тумбы с раковинами PointWoodcraft, зеркала Hard Massive.</p><p>Комната дочери: кровать Ditre Italia, прикроватные тумбы PointWoodcraft, кресло</p><p>Norr11, ковер Art de Vivre, светильник Vistosi, оформление кровати AtelierTati, фигурка «Птичка» Normann Copenhagen, лампа &amp;tradition, держатели для книг Audo Copenhagen.</p><p>Комната сына: кровать Woodfans, рабочий стол ДереВо, светильник Francesc Vilaró, ковер Art de Vivre, тумба Kartell, оформление кровати AtelierTati, пуфы Modenature.</p><p>Санузел при комнате сына: тумба и раковина Cielo, смесители и душевая система Gessi, зеркало и душевая перегородка RG Engineering.</p></div></noscript></main>
