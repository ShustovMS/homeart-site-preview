<main id="main"><noscript><div class="wrap"><h1>ЖК KNIGHTSBRIDGE</h1><p>Квартира для семьи с 2-мя приватными зонами. Общая площадь — 270 м2.</p><p>Квартира для семьи с 2-мя приватными зонами.</p><p>Общая площадь — 270 м2.</p><p>Планировка:</p><p>слева: общая жилая зона гостиной, столовой и кухни;</p><p>справа: приватные зоны мастер-блока и детской зоны. В каждой: спальня, гардеробная, кабинет, ванная комната.</p><p>«Наш проект — спокойный, с чувством собственного достоинства и уверенный в своей неотразимости. Он под стать хозяевам — людям утонченным, увлекающимся искусством. Мы старались создать интерьер, который был бы столь же интеллигентным и стильным», — Анастасия Шевченко.</p><p>Отправной точкой в создании концепции проекта стал глубокий зеленый оттенок дивана Minotti в зоне гостиной. Интерьер выполнен в сдержанной палитре натуральных оттенков с декоративными акцентами золотистой латуни.</p><p>Корпусная мебель выполнена по эскизам дизайнера проекта на столярном производстве HOMEART.</p><p>Гостиная: модульный диван со столиком Minotti, журнальные столики Flou, настенный светильник Luxxu.</p><p>Столовая и кухня: обеденный стол Lago, кресла обеденные Poliform, подвесная люстра Vistosi, барные стулья Aster, тумба Lema, подвесной светильник Grok.</p><p>Холл: кресло Minotti, консоль Oasis Home, настенный светильник Luxxu.</p><p>Мастер-спальня: кровать Rugiano, прикроватная тумба Giorgetti, кресло Capital, комод Stylish Club, светильник Lodes, светильник настенный Zonсa.</p><p>Гардеробные: корпусная мебель Rimadesio, пуф Capital, пуф Laskasas, оттоманка Minotti.</p><p>Кабинет: письменный стол Capital, кресло Thonet, раскладной диван Milano Bedding.</p><p>Мастер-санузлы: ванна овальная inbani, встроенная полка Antonio Lupi, подвесной унитаз и биде Cielo, аксессуары CEA design, подвесной унитаз Globo.</p><p>Детская зона: кровать Baxter, прикроватная тумба Reflex Angelo, светильник подвесной Haberdashery, диван B&amp;B Italia в ткани DEDAR, кресло на колесиках B&amp;B Italia, пуф Domingo, люстра центральная Moooi.</p><p>Детский санузел: подвесной унитаз, биде, раковина Cielo, аксессуары CEA Design, полотенцедержатель Antonio Lupi, подвесной светильник Lee Broom.</p><p>Гостевой санузел: подвесной писсуар и унитаз Cielo, аксессуары CEA Design.</p></div></noscript></main>
