<main id="main"><noscript><div class="wrap"><h1>«РИВЬЕРА» ЕКАТЕРИНБУРГ</h1><p>Проект создан для многодетной супружеской пары, где каждый элемент интерьера подчеркивает статус и индивидуальность владельцев. Вся итальянская мебель, декоративный свет, смесители и плитка поставлены шоурумом HOMEART</p><p>Роскошь объединенного пространства для семьи с 4-мя детьми.</p><p>Общая площадь проекта — 254 м².</p><p>Проект создан для многодетной супружеской пары, где каждый элемент интерьера подчеркивает статус и индивидуальность владельцев без потери функциональности.</p><p>Демонтаж межквартирных перегородок позволил создать единое пространство гостиной, столовой и кухни. Кухонный гарнитур дополнен островом с барными стульями Molteni в алой обивке. Фартук из закаленного стекла скрывает зону с техникой.</p><p>В гостиной установлен удобный диван Albert от Molteni и два кресла от этого же бренда, которые гармонично сочетаются с мебелью Porada в матовом исполнении. В обеденной зоне — 8 стульев Devon от Molteni, напольные светильники Officina. Массивная люстра от Patrizia Garganti дополняет композицию мягким светом.</p><p>В мастер-спальне установлена кровать Ribbon от Molteni с интегрированным в стену изголовьем. Интерьер дополняют прикроватные замшевые тумбы Flou и настольные лампы Sigma elle due. На потолке роскошная люстра от Patrizia Garganti.</p><p>В детских использована мебель Twills, мягкая мебель Ditre и стеллаж Cattelan, а также письменный стол от Molteni. Светильники Artemide.</p><p>В трех санузлах использованы смесители и аксессуарами Gessi, лаконичные белые бра Pentalight.</p><p>Вся итальянская мебель, декоративный свет, смесители и плитка поставлены шоурумом HOMEART. Мы помогаем реализовывать проекты премиум-класса любой сложности. Для обсуждения деталей напишите нам на mos@homeart.pro, и наша команда бережно подберет лучшую мебель и декор из Европы и решит все вопросы с логистикой, хранением и сборкой.</p></div></noscript></main>

<script>

          <button type="button" class="btn" data-call="Проект: ${esc(p.title)}" style="margin-top:28px">Обсудить проект</button></div>
        ${p.authorPhoto ? `<figure class="pportrait"><img src="${p.authorPhoto}" alt="${esc(p.author)}"></figure>` : ''}
