<main id="main"><noscript><div class="wrap"><h1>ЖК VESPER</h1><p>Апартаменты 149 м2 в клубном доме Vesper.</p><p>Апартаменты 149 м2 в клубном доме Vesper. Пространства здесь сдаются с готовой отделкой, поэтому предметы мебели, свет и декор стали единственными инструментами в руках дизайнеров для создания особенной и выразительной атмосферы.</p><p>Для данного проекты были подобраны и бережно доставлены уникальные арт-объекты от французского художника Mathieu Lehanneur:</p><p>Мраморная консоль малахитового цвета в обеденной зоне.</p><p>Консоль с мраморной столешницей в прихожей.</p><p>Кофейный столик со стеклянным основанием у дивана.</p><p>Работы Mathieu Lehanneu выставлены в главных музеях современного искусства: Centre Pompidou (Paris), Museum of Modern Art (New-York / San Francisco), Musée des Arts Décoratifs (Paris), Design Museum, Gent (Belgium), FRAC (Ile de France).</p><p>Входная группа: мраморная консоль Mathieu Lehanneur, круглое зеркало над консолью Miniforms, футуристичные вазы Klein Reid, белый пуф 101CPH, напольное зеркало Sovet, деревянный табурет Cassina.</p><p>Кухня и столовая: обеденный стол из стекла Glas Italia, стулья Massproductions, подвесной светильник DCW Editions, мраморная консоль Mathieu Lehanneur, черные барные стулья Massproductions у острова.</p><p>Мягкая зона: диван Edra, кожаное кресло Poliform, кофейный столик Mathieu Lehanneur, кофейный столик из дерева Cassina.</p><p>Спальня: кровать с мягким изголовьем Meridiani, прикроватные тумбы Meridiani, скамья у кровати Cassina, бра Rakumba, настольная лампа Ross Gardan на консоли около картины.</p><p>Кабинет: рабочий стол и кресло Molteni&amp;C, настольная лампа Lumina, голубой диван Arflex, бра Paul Matter, матовый белый кофейный столик Sancal, кресло Cassina, кофейный столик Carl Hansen &amp; Son, стеллаж Molteni&amp;C. В ванной комнате: бра Ross Gardan.</p><p>Аксессуары: ароматы для дома Culti, посуда и столовые приборы.</p><p>Serax/Menuspace/Kristina Dam, емкости для специй When objects work/Ferm living.</p></div></noscript></main>

<script>
