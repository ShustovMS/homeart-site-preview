<main id="main"><noscript><div class="wrap"><h1>Дизайн интерьера загородного дома ТЕН на Новой Риге</h1><p>Загородный дом на Новой Риге — Babayants Architects, Артём и Лия Бабаянц. Кухня и гардеробная Molteni&amp;C, мебель B&amp;B Italia, Flexform, Roda. Фото проекта.</p><p>Дизайн интерьера загородного дома на Новой Риге от архитекторов Артёма и Лии Бабаянц (Babayants Architects) выстроен архитектурно: единые натуральные материалы связывают комнаты в непрерывную среду без границ для взгляда и света. Фон интерьера — природа и виды на сад.</p><p>Дом наполнен мебелью ведущих мировых фабрик: Molteni&amp;C, B&amp;B Italia, Meridiani, Roda, Carl Hansen &amp; Søn, Poliform, Tribù, Flexform, CEA, Antonio Lupi.</p><h2>Кухня-столовая и гостиная</h2><p>На первом этаже кухня-столовая и гостиная расположены на разных уровнях — так появляется мягкое зонирование. Кухня и барные стулья — итальянский бренд Molteni&amp;C, над обеденной зоной — потолочный светильник австралийской компании Rakumba. Диван в светлой отделке задаёт баланс.</p><h2>Лаунж с камином и выход в сад</h2><p>Между гостиной и садом — лаунж с камином и купель с сауной. Летом стеклянный фасад распахивается, и эти зоны открываются в сад. Световые фонари в кровле наполняют дом светом в любое время. Шезлонги и диван в цвете Grass cat — бренд Roda.</p><h2>Мастер-спальни и гардеробные</h2><p>На втором этаже — приватные зоны: две мастер-спальни с гардеробными и плавным переходом в ванные. В одной из спален туалетный столик из камня и дерева встроен в изголовье кровати. Гардеробная — архитектурное решение Molteni&amp;C, где функциональность становится искусством.</p><h2>Свет</h2><p>В интерьере использованы светильники Lumina, Rakumba, Rass Gardam, Paul Matter, DCW Editions, Ingo Maurer, Wenz Design и Articolo Lighting — каждая модель подчёркивает архитектурную стройность дома. Стеклянные перегородки и единые линии расширяют его пределы и стирают границу между интерьером и садом.</p><h2>Комплектация HOMEART</h2><p>Кухню и гардеробную Molteni&amp;C, мебель и декоративный свет для дома поставил шоурум HOMEART. Мы помогаем реализовывать загородные проекты премиум-класса любой сложности.</p></div></noscript></main>

      <div class="pbody">

          <button type="button" class="btn" data-call="Проект: ${esc(p.title)}" style="margin-top:28px">Обсудить проект</button></div>

      <div class="ptiles">${PJ.tiles(more)}</div></section></div>` : ''}`;

})();
