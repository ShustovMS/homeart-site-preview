<main id="main"><noscript><div class="wrap"><h1>ЖК САДЫ ПЕКИНА</h1><p>Личные апартаменты для отдыха. Общая площадь проекта — 120 м².</p><p>Личные апартаменты для отдыха.</p><p>Общая площадь проекта — 120 м².</p><p>«Для Садов Пекина вдохновением стал монументальный образ Сталинской архитектуры и азиатский мотив в названии ЖК, который подкрепился личными предпочтениями заказчицы. Поэтому в материалах и геометрии проекта мы видим аскетизм, натуральность, медитативность, как в саду камней. Это пространство, созданное для того, чтобы красиво замедлиться», — Артур Митрошкин.</p><p>Планировка: гостиная с небольшой зоной кухни, мастер-спальня, кабинет, 2 гардероба, 2 санузла и единый проход-галерея вдоль окон между всеми жилыми зонами.</p><p>Создание единого пространства без глухих перегородок и баланс цвета с преобладанием темным оттенков позволили добиться необходимого обволакивающего эффекта и ощущения полной безмятежности со вкусом благородной Азии.</p><p>Кухня: остров по индивидуальному чертежу Woak Design, светильник Baxter.</p><p>Гостиная: диван и столик Baxter, кресло и столик Henge, торшер LucePlan, дверь Rimadesio, непальский ковер с шелком Jerome Botanic, картина Ли Шевалье (Франция) Booroom Gallery, барельеф с сюжетом Китайских гравюр (5,5 м) от студии Леонида Кима.</p><p>Мастер-спальня: кровать Minotti, столик Baxter, композиция с закрытой тумбой и фарфоровыми подвесными светильниками Bocci.</p><p>Мастер-санузел: смесители Dornbracht, аксессуары и унитаз Antonio Lupi, полотенцесушители Cea.</p><p>Гостевой санузел: дверь Rimadesio, смесители Dornbracht, аксессуары и унитаз Antonio Lupi.</p><p>Кабинет: диван Living Divani, столик Cattelan Italia, пуф Henge, торшер Artemide, ковер JeromeBotanic.</p><p>Гардероб: реечная перегородка со стеклом Rimadesio.</p></div></noscript></main>
